name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/vas3k/base
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/vas3k/base:buildcache
          cache-to: type=registry,ref=ghcr.io/vas3k/base:buildcache,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    env:
      SSH_KEY_PATH: /tmp/ssh_key
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_USERNAME: ${{ secrets.PRODUCTION_SSH_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make envfile
        run: |
          umask 077
          export | grep '^declare -x secret_' | sed 's/^declare -x secret_//' > .env
          echo "GITHUB_SHA=sha-${GITHUB_SHA::7}" >> .env
        env:
          secret_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          secret_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          secret_MEDIA_UPLOAD_CODE: ${{ secrets.MEDIA_UPLOAD_CODE }}
          secret_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          secret_EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          secret_EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          secret_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          secret_TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          secret_TELEGRAM_BASE_CHAT_ID: ${{ secrets.TELEGRAM_BASE_CHAT_ID }}
          secret_CLUB_OPENID_CONFIG_SECRET: ${{ secrets.CLUB_OPENID_CONFIG_SECRET }}
          secret_CLUB_SERVICE_TOKEN: ${{ secrets.CLUB_SERVICE_TOKEN }}
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      - name: Upload configuration
        run: scp -i "$SSH_KEY_PATH" .env docker-compose.production.yml "$SSH_USERNAME@$SSH_HOST:/home/vas3k/basa.club/"
      - name: Log in to GHCR on the host
        run: printf '%s' "$GHCR_TOKEN" | ssh -i "$SSH_KEY_PATH" "$SSH_USERNAME@$SSH_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        run: >-
          ssh -i "$SSH_KEY_PATH" "$SSH_USERNAME@$SSH_HOST"
          "cd /home/vas3k/basa.club &&
          docker compose -f docker-compose.production.yml --env-file=.env pull &&
          docker compose -f docker-compose.production.yml --env-file=.env up -d"
