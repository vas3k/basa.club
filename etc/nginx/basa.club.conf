server {
    listen 80;
    listen [::]:80;
    server_name basa.club;
    return 301 https://basa.club$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name basa.club;
    ssl_certificate /home/vas3k/certs/pubkey.pem;
    ssl_certificate_key /home/vas3k/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    charset utf-8;
    client_max_body_size 30m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log off;
    location /static/ {
        alias /home/vas3k/basa.club/frontend/static/;
        expires 1h;
    }
    location /static/dist/assets/ {
        alias /home/vas3k/basa.club/frontend/static/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~ /\. {
        deny all;
    }
    location /telegram/webhook/ {
        proxy_pass http://127.0.0.1:8826/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
        proxy_buffering off;
        access_log off;
        error_log /dev/null;
    }
    location / {
        proxy_pass http://127.0.0.1:8824;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
        proxy_read_timeout 65s;
    }
}
