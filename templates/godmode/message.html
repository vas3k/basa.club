{% extends "godmode/layout.html" %}

{% block title %}
    {{ title }} — {{ block.super }}
{% endblock %}

{% block godmode_content %}
    <div class="godmode-message">
        {% if title %}
            <div class="godmode-message-title">{{ title }}</div>
        {% endif %}
        <div class="godmode-message-text">{{ message }}</div>
    </div>
{% endblock %}
