{% extends "layout.html" %}
{% load static %}

{% block title %}
    Мой профиль — {{ block.super }}
{% endblock %}

{% block subheader %}{% endblock %}

{% block main %}
    <section class="main">
        <div class="content">
            <div class="block profile">
                <div class="block-header profile-header">Я — {{ user.full_name }}</div>
            </div>

            <div class="profile-footer">
                <a href="{% url "logout" %}" class="button button-red">Выйти</a>
            </div>
        </div>
    </section>
{% endblock %}
