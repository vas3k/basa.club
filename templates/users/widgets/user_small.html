{# {% include "users/widgets/user_small.html" with user=item.author %} #}
<a class="user-small" href="{{ user.get_absolute_url }}">
    <span class="avatar user-small-avatar" style="background-image: url('{{ user.default_avatar }}');"></span>
    <span class="user-small-name">{% firstof user.full_name user.slug %}</span>
    <span class="rating {% if user.rating > 0 %}rating-positive{% elif user.rating < 0 %}rating-negative{% else %}rating-zero{% endif %}" title="Репутация">{% if user.rating > 0 %}+{% endif %}{{ user.rating }}</span>
</a>
