{# {% include "users/widgets/user_small.html" with user=item.author %} #}
<a class="user-small" href="{% if request.user.is_authenticated %}{{ user.get_absolute_url }}{% else %}{% url "login" %}{% endif %}">
    <span class="avatar user-small-avatar" style="background-image: url('{{ user.default_avatar }}');"></span>
    <span class="user-small-name">{% if request.user.is_authenticated %}{% firstof user.full_name user.slug %}{% else %}Юзер Базы{% endif %}</span>
    <span class="rating {% if user.rating > 0 %}rating-positive{% elif user.rating < 0 %}rating-negative{% else %}rating-zero{% endif %}" title="Репутация">{{ user.rating|rating }}</span>
</a>
