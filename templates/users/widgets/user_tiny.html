{# {% include "users/widgets/user_tiny.html" with user=reply.author %} #}
<a class="user-tiny" href="{% if request.user.is_authenticated %}{{ user.get_absolute_url }}{% else %}{% url "login" %}{% endif %}">
    <span class="avatar user-tiny-avatar" style="background-image: url('{{ user.default_avatar }}');"></span>
    <span class="user-tiny-name">{% if request.user.is_authenticated %}{% firstof user.full_name user.slug %}{% else %}Юзер Базы{% endif %}</span>
</a>
