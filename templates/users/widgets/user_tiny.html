{# {% include "users/widgets/user_tiny.html" with user=reply.author %} #}
{% if request.user.is_authenticated %}
    <a class="user-badge user-badge-tiny" href="{{ user.get_absolute_url }}">
        <span class="avatar" style="background-image: url('{{ user.default_avatar }}');"></span>
        <span class="user-badge-name">{% firstof user.full_name user.slug %}</span>
    </a>
{% endif %}
