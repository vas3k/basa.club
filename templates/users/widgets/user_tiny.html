{# {% include "users/widgets/user_tiny.html" with user=reply.author %} #}
{% if request.user.is_authenticated %}
    <a class="user-tiny" href="{{ user.get_absolute_url }}">
        <span class="avatar user-tiny-avatar" style="background-image: url('{{ user.default_avatar }}');"></span>
        <span class="user-tiny-name">{% firstof user.full_name user.slug %}</span>
    </a>
{% endif %}
