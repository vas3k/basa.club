{% if item.images %}
    <div class="item-gallery" data-behavior="gallery">
        {% for image in item.images %}
            {% if image.image %}
                <a href="{{ image.image }}" data-nofavicon>
                    <img class="image-cover" src="{{ image.image }}" alt="">
                </a>
            {% endif %}
        {% endfor %}
    </div>
{% endif %}
