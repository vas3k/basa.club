{% item_url item as item_link %}
<div class="row item-actions">
    <a class="inline-block item-action" href="{{ item_link }}" title="Просмотры" aria-label="Просмотры {{ item.view_count|cool_number }}">
        <i class="fas fa-eye"></i>
        <span class="item-action-count">{{ item.view_count|cool_number }}</span>
    </a>

    {% item_bookmark item %}

    {% if request.user.is_authenticated %}
        <a class="inline-block item-action" href="{{ item_link }}#comments" title="Комментарии" aria-label="Комментарии {{ item.comment_count|cool_number }}">
            <i class="far fa-comment"></i>
            <span class="item-action-count">{{ item.comment_count|cool_number }}</span>
        </a>
    {% endif %}

    {% item_flag item %}

    <button type="button" class="inline-block item-action item-action-icon" data-behavior="copy" data-copy="{{ request.scheme }}://{{ request.get_host }}{{ item_link }}" title="Скопировать ссылку" aria-label="Скопировать ссылку">
        <i class="fas fa-share-alt"></i>
    </button>
    
    {% if show_bookmark_remove %}
        <form method="post" action="{% url "bookmark_remove" item.id %}" class="item-bookmark-remove">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.get_full_path }}">
            <button type="submit" class="inline-block item-action item-action-icon" title="Убрать из закладок" aria-label="Убрать из закладок">
                <i class="fas fa-times"></i>
            </button>
        </form>
    {% endif %}
</div>
