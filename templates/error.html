{% extends "layout.html" %}

{% block subheader %}{% endblock %}

{% block main %}
    <section class="main">
        <div class="content">
            <div class="block error">
                <div class="block-icon">❌</div>

                {% if title %}
                    <div class="block-header">{{ title }}</div>
                {% endif %}

                <div class="block-description block-description-center">
                    {{ message | safe }}
                </div>
            </div>
        </div>
    </section>
{% endblock %}
