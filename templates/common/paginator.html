{% if items and num_pages > 1 %}
    <div class="clearfix50"></div>
    <div class="paginator">
        {% if items.has_previous %}
            <a href="{% paginator_page_url items.previous_page_number %}" class="paginator-page">&larr;</a>
        {% endif %}

        {% if show_first %}
            <a href="{% paginator_page_url 1 %}" class="paginator-page">1</a>
            <span class="paginator__dots">...</span>
        {% endif %}

        {% for page in page_numbers %}
            <a href="{% paginator_page_url page %}" class="paginator-page {% if page == items.number %}paginator-page-active{% endif %}">
                {{ page }}
            </a>
        {% endfor %}

        {% if show_last %}
            <span class="paginator__dots">...</span>
            <a href="{% paginator_page_url num_pages %}" class="paginator-page">{{ num_pages }}</a>
        {% endif %}

        {% if items.has_next %}
            <a href="{% paginator_page_url items.next_page_number %}" class="paginator-page">&rarr;</a>
        {% endif %}
    </div>
{% endif %}
